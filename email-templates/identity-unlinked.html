<!--
  VOGA System - Identity Unlinked Notification
  Copy this HTML content to Supabase: Authentication > Email Templates > Identity unlinked
  
  Available variables:
  {{ .Email }} - User's email
  {{ .SiteURL }} - Your site URL

<!DOCTYPE html>
<html dir="rtl" lang="ar">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تم إلغاء ربط هوية - VOGA</title>
</head>

<body
    style="margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Arial, sans-serif; background: linear-gradient(135deg, #0f172a 0%, #0e3c63 50%, #0f172a 100%); min-height: 100vh;">

    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="min-height: 100vh;">
        <tr>
            <td align="center" style="padding: 40px 20px;">

                <table role="presentation" width="100%" cellspacing="0" cellpadding="0"
                    style="max-width: 480px; background: #ffffff; border-radius: 32px; overflow: hidden; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);">

                    <!-- Header -->
                    <tr>
                        <td
                            style="background: linear-gradient(135deg, #64748b 0%, #475569 100%); padding: 40px 30px; text-align: center;">
                            <div
                                style="width: 80px; height: 80px; background: rgba(255,255,255,0.15); border-radius: 24px; margin: 0 auto 20px;">
                                <img src="https://img.icons8.com/fluency/96/unlink.png" alt="Unlink" width="48"
                                    height="48" style="display: block; margin: 16px auto;">
                            </div>
                            <h1 style="margin: 0; color: #ffffff; font-size: 24px; font-weight: 800;">تم إلغاء ربط هوية
                                🔓</h1>
                            <p
                                style="margin: 10px 0 0; color: rgba(255,255,255,0.8); font-size: 14px; font-weight: 600;">
                                إشعار أمني</p>
                        </td>
                    </tr>

                    <!-- Body -->
                    <tr>
                        <td style="padding: 40px 30px;">
                            <div
                                style="background: #f1f5f9; border: 1px solid #cbd5e1; border-radius: 16px; padding: 20px; margin: 0 0 24px; text-align: center;">
                                <p style="margin: 0; color: #475569; font-size: 14px; font-weight: 700;">
                                    ✓ تم إلغاء ربط طريقة تسجيل دخول من حسابك
                                </p>
                            </div>

                            <p
                                style="margin: 0 0 20px; color: #374151; font-size: 16px; line-height: 1.8; text-align: center;">
                                لن تتمكن بعد الآن من تسجيل الدخول باستخدام الهوية التي تم إلغاء ربطها.
                            </p>

                            <div
                                style="background: #f3f4f6; border-radius: 12px; padding: 16px; margin: 24px 0; text-align: center;">
                                <p style="margin: 0; color: #6b7280; font-size: 12px;">الحساب</p>
                                <p style="margin: 4px 0 0; color: #1f2937; font-size: 16px; font-weight: 800;">{{ .Email
                                    }}</p>
                            </div>

                            <!-- Warning -->
                            <div
                                style="background: #fef2f2; border: 1px solid #fecaca; border-radius: 12px; padding: 16px; margin: 24px 0;">
                                <p
                                    style="margin: 0; color: #991b1b; font-size: 13px; text-align: center; line-height: 1.6;">
                                    🚨 <strong>لم تقم بهذا الإجراء؟</strong>
                                    <br>
                                    قد يكون شخص ما قد وصل لحسابك. اتصل بالدعم فوراً.
                                </p>
                            </div>
                        </td>
                    </tr>

                    <!-- Footer -->
                    <tr>
                        <td
                            style="background: #f9fafb; padding: 24px 30px; text-align: center; border-top: 1px solid #e5e7eb;">
                            <p style="margin: 0; color: #9ca3af; font-size: 12px; font-weight: 600;">
                                VOGA System © 2026 • Security Notification
                            </p>
                        </td>
                    </tr>

                </table>

            </td>
        </tr>
    </table>

</body>

</html>
