<html lang="ar" dir="rtl">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>معاينة بوابة الوكيل للموبايل</title>
  <style>
    body {
      margin: 0;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: .75rem;
      background: #ebf0f5;
      color: #0e3c63;
      font: 15px system-ui, sans-serif;
    }
    p { margin: 0; font-weight: 700; }
    iframe {

      background: white;
      box-shadow: 0 0 0 1px #ccd8e2, 0 12px 40px #0e3c631a;
    }
    @media (max-width: 410px) {
      iframe { border-radius: 0; }
    }
  </style>
</head>
<body>
  <p>معاينة الموبايل · بيانات تجريبية</p>
